description: Offcall is a career and practice platform for physicians, backed by Bloomberg Beta. It
  provides confidential, anonymous physician salary and compensation benchmarking, and a verified
  clinician-to-clinician patient referrals network with HIPAA-compliant messaging for care coordination,
  delivered through web and mobile (iOS and Android) applications. Offcall does not currently publish a
  public developer API, developer portal, or OpenAPI specification; this profile was surfaced through the
  Bloomberg Beta portfolio and enriched with the identity and domain-security signals that are publicly
  available.
